name: Release

# 打 tag 即发版：构建 → 生成来源证明（artifact attestation）→ 建 release。
# tag 必须与 manifest.json 的 version 一致，且不带前缀 v。
#
# 这一份继承自 js_02（note-tidy）：比官方模板多了"跑测试"与"tag 与版本号一致性校验"
# 两步 —— 版本号忘了改就打 tag 是最容易犯的错。
on:
    push:
        tags: ["*"]
    # 已经存在的 tag 需要补发时，手动触发并填 tag 名
    workflow_dispatch:
        inputs:
            tag:
                description: "要发布的 tag（须已存在，例如 0.1.0）"
                required: true

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            TAG: ${{ inputs.tag || github.ref_name }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.tag || github.ref_name }}

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "npm"

            - run: npm ci
            - run: npm test
            - run: npm run build

            - name: Check tag matches manifest version
              run: |
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$version" != "$TAG" ]; then
                    echo "::error::tag $TAG 与 manifest.json 的 version $version 不一致"
                    exit 1
                  fi

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$TAG" \
                    --title "$TAG" \
                    --generate-notes \
                    main.js manifest.json styles.css
